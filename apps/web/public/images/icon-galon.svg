<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none">
  <!-- Galon 19L Suti Water -->

  <!-- Body galon — biru transparan -->
  <ellipse cx="60" cy="145" rx="42" ry="8" fill="#93c5fd" opacity="0.4"/>

  <!-- Badan utama galon -->
  <path d="M22 75 Q18 90 18 110 Q18 148 60 148 Q102 148 102 110 Q102 90 98 75 Z"
        fill="url(#galonBody)" stroke="#60a5fa" stroke-width="1.5"/>

  <!-- Bahu galon -->
  <path d="M22 75 Q25 55 60 52 Q95 55 98 75 Z"
        fill="url(#galonShoulder)" stroke="#60a5fa" stroke-width="1.5"/>

  <!-- Leher galon -->
  <rect x="46" y="28" width="28" height="26" rx="4"
        fill="url(#galonNeck)" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Tutup galon — biru tua -->
  <rect x="44" y="18" width="32" height="14" rx="6"
        fill="url(#galonCap)" stroke="#1d4ed8" stroke-width="1"/>
  <!-- Lekukan tutup -->
  <line x1="50" y1="20" x2="50" y2="30" stroke="#1e40af" stroke-width="1" opacity="0.5"/>
  <line x1="55" y1="20" x2="55" y2="30" stroke="#1e40af" stroke-width="1" opacity="0.5"/>
  <line x1="60" y1="20" x2="60" y2="30" stroke="#1e40af" stroke-width="1" opacity="0.5"/>
  <line x1="65" y1="20" x2="65" y2="30" stroke="#1e40af" stroke-width="1" opacity="0.5"/>
  <line x1="70" y1="20" x2="70" y2="30" stroke="#1e40af" stroke-width="1" opacity="0.5"/>

  <!-- Label oval -->
  <ellipse cx="60" cy="108" rx="32" ry="26" fill="white" opacity="0.9"/>
  <ellipse cx="60" cy="108" rx="32" ry="26" fill="none" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Tetes air di label -->
  <path d="M60 88 Q60 88 52 100 Q50 104 52 108 Q54 114 60 114 Q66 114 68 108 Q70 104 68 100 Z"
        fill="url(#dropGalon)" opacity="0.85"/>

  <!-- Gunung kecil di label -->
  <path d="M42 118 L52 104 L58 112 L64 100 L78 118 Z"
        fill="url(#mountainGalon)" opacity="0.7"/>

  <!-- Teks Suti -->
  <text x="60" y="127" font-family="Arial" font-size="10" font-weight="800"
        fill="#1e3a8a" text-anchor="middle">Suti</text>
  <text x="60" y="136" font-family="Arial" font-size="6" font-weight="500"
        fill="#3b82f6" text-anchor="middle">Water</text>

  <!-- Highlight badan galon -->
  <path d="M30 80 Q28 100 29 120" stroke="white" stroke-width="4"
        stroke-linecap="round" opacity="0.35"/>

  <defs>
    <linearGradient id="galonBody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bfdbfe"/>
      <stop offset="40%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="galonShoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="galonNeck" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="galonCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="dropGalon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="mountainGalon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
  </defs>
</svg>
